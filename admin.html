<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoneBridge | Admin</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f2;color:#202423;font:16px system-ui}header{background:#172724;color:white;padding:26px 5%;display:flex;justify-content:space-between;align-items:center}small{display:block;font-size:12px;letter-spacing:.18em;margin-top:5px;color:#b9c9c2}main{max-width:1250px;margin:40px auto;padding:0 24px}h1{font:36px Georgia;margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}.card{background:white;border:1px solid #d8dfdb;padding:24px}.card b{display:block;font-size:32px;margin-top:8px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}input,select,button{font:inherit;padding:12px;border:1px solid #c6d0ca;border-radius:4px}button{cursor:pointer;background:#234b3e;color:white}input{flex:1;min-width:180px}.table{overflow:auto;background:white}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:16px;border-bottom:1px solid #e2e6e3}th{font-size:14px;color:#59675f}td button{background:transparent;color:#234b3e;padding:6px 10px}#login{max-width:460px;background:white;padding:32px;margin:80px auto}#login input{width:100%;margin:12px 0}#notice{min-height:28px;color:#8d331f}dialog{border:1px solid #b9c9c2;max-width:650px;width:90%;padding:30px}dialog::backdrop{background:#13251db3}dl{display:grid;grid-template-columns:120px 1fr;gap:12px}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}dt{color:#59675f}#more{margin-top:20px}@media(max-width:600px){.cards{grid-template-columns:1fr}.card{padding:16px}header{padding:22px}dl{grid-template-columns:1fr}h1{font-size:30px}}

body{background:#f7f5f0;color:#151514;font-family:"DM Sans",Arial,sans-serif}header{background:#1d1c1a;border-bottom:1px solid #3a3732;padding:26px 5%}header>div{font-size:18px;letter-spacing:.15em;font-weight:600}small{font-size:12px;color:#c9bda9;letter-spacing:.22em}h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:48px;font-weight:400;letter-spacing:-.025em}.card{border-color:#d8d1c5;padding:26px;background:#fff}.card b{font-family:"Cormorant Garamond",Georgia,serif;font-size:46px;font-weight:500}button{background:#151514;color:white;border-color:#151514;border-radius:0}input,select{border-color:#d8d1c5;border-radius:0;background:#fff;color:#151514}th,dt{color:#68655f}th{background:#ebe6dc}td,th{border-color:#e4ded3}td button{color:#151514;border-color:#d8d1c5}dialog{background:#f7f5f0;border-color:#d8d1c5}dialog::backdrop{background:#151514b3}#login{border:1px solid #d8d1c5;box-shadow:0 20px 60px #1515140d}#notice{color:#8d331f}button:hover{opacity:.85}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #786447;outline-offset:3px}
</style><header><div>STONEBRIDGE<small>DEVELOPMENT GROUP / ADMIN</small></div><button id="logout" hidden>Lock dashboard</button></header><main><div id="login"><h1>Admin access</h1><form id="auth"><label for="key">Admin access key</label><input id="key" type="password" autocomplete="off" required><button>Unlock dashboard</button></form></div><p id="notice" role="status"></p><section id="app" hidden><h1>Submission inbox</h1><div class="cards"><div class="card">Total submissions<b id="total">—</b></div><div class="card">New leads<b id="new">—</b></div><div class="card">Email failures<b id="failed">—</b></div></div><div class="tools"><input id="search" placeholder="Search name, email, or property" aria-label="Search submissions"><select id="type" aria-label="Submission type"><option value="">All submissions</option><option value="seller">Property sellers</option><option value="contact">Contact inquiries</option></select><select id="status" aria-label="Lead status"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>In review</option><option>Closed</option></select><button id="refresh">Refresh</button><button id="export">Export filtered CSV</button></div><div class="table"><table><thead><tr><th>Received</th><th>Name</th><th>Property / inquiry</th><th>Type</th><th>Status</th><th>Email</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><button id="more" hidden>Load more</button></section></main><dialog id="detail"><h1>Lead details</h1><dl id="fields"></dl><label>Status <select id="edit"><option>New</option><option>Contacted</option><option>In review</option><option>Closed</option></select></label><p><button id="save">Save status</button> <button id="close">Close</button></p></dialog><script>
let token='',items=[],offset=0,selected;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('https://stonebridge.psznbzhnps.workers.dev/admin/api'+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(r.status===401){lock();throw Error('Access key is invalid.');}const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load records.');return d;}
function lock(){token='';items=[];$('app').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('rows').innerHTML='';$('detail').close();}
function params(){return new URLSearchParams({q:$('search').value,type:$('type').value,status:$('status').value});}
async function load(append=false){try{$('notice').textContent='Loading…';offset=append?items.length:0;const q=params();q.set('offset',offset);const d=await api('/leads?'+q);items=append?items.concat(d.items):d.items;$('total').textContent=d.stats.total;$('new').textContent=d.stats.fresh;$('failed').textContent=d.stats.failed;$('rows').innerHTML=items.map(x=>'<tr><td>'+esc(new Date(x.created_at).toLocaleString())+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.address||x.property||x.subject)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.email_status)+'</td><td><button data-id="'+esc(x.id)+'">View</button></td></tr>').join('');$('more').hidden=!d.more;$('notice').textContent=items.length?'':'No submissions match these filters.';}catch(e){$('notice').textContent=e.message;}}
$('auth').onsubmit=async e=>{e.preventDefault();token=$('key').value;$('key').value='';await load();if(token){$('login').hidden=true;$('app').hidden=false;$('logout').hidden=false;}};$('logout').onclick=lock;$('refresh').onclick=()=>load();$('more').onclick=()=>load(true);let timer;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load(),300)};['type','status'].forEach(id=>$(id).onchange=()=>load());
$('rows').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;selected=items.find(x=>x.id===b.dataset.id);$('fields').innerHTML=Object.entries(selected).filter(([k])=>k!=='id').map(([k,v])=>'<dt>'+esc(k.replaceAll('_',' '))+'</dt><dd>'+esc(v)+'</dd>').join('');$('edit').value=selected.status;$('detail').showModal();};$('close').onclick=()=>$('detail').close();$('save').onclick=async()=>{try{await api('/leads/'+selected.id,{method:'PATCH',body:JSON.stringify({status:$('edit').value})});$('detail').close();await load();}catch(e){$('notice').textContent=e.message;}};
$('export').onclick=async()=>{try{let all=[],off=0;while(true){const q=params();q.set('offset',off);const d=await api('/leads?'+q);all.push(...d.items);if(!d.more)break;off=all.length;}const keys=['created_at','type','name','email','phone','address','timing','condition','property','subject','message','consent','status','email_status'];const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const csv=[keys.join(','),...all.map(x=>keys.map(k=>cell(x[k])).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='stonebridge-submissions.csv';a.click();URL.revokeObjectURL(u);}catch(e){$('notice').textContent=e.message;}};
</script></html>
